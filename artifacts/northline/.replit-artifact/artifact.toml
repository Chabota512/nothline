kind = "mobile"
previewPath = "/"
title = "Northline"
version = "1.0.0"
id = "artifacts/northline"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19290

[services.development]
run = "pnpm --filter @workspace/northline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/northline", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/northline", "run", "serve" ]

[services.env]
PORT = "19290"
BASE_PATH = "/"
